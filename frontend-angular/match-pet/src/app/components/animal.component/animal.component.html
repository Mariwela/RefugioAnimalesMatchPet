<div class="contenedor-animales">
    <h2>Animales Esperando un Hogar</h2>

    <div *ngIf="cargando" class="mensaje-carga">
        <p>Buscando peludos disponibles...</p>
    </div>

    <div *ngIf="errorMsg" class="mensaje-error">
        <p>{{ errorMsg }}</p>
    </div>

    <div *ngIf="!cargando && !errorMsg" class="grid-animales">

        <div class="tarjeta-animal" *ngFor="let animal of animales">
            <img [src]="animal.foto_portada" [alt]="'Foto de ' + animal.nombre" class="foto-animal">
            <div class="info-animal">
                <h3>{{ animal.nombre }}</h3>
                <span class="etiqueta">{{ animal.especie }}</span>
                <p><strong>Raza:</strong> {{ animal.raza }}</p>
                <p><strong>Sexo:</strong> {{ animal.sexo }}</p>
                <p><strong>Tamaño:</strong> {{ animal.tamano }}</p>
                <button class="btn-adoptar" (click)="verDetalles(animal.id_animal)">Ver Perfil</button>

            </div>
        </div>
        <div class="paginacion" *ngIf="!cargando && animales.length > 0" style="text-align: center; margin-top: 20px;">

            <button [disabled]="paginaActual === 1" (click)="cambiarPagina(paginaActual - 1)"
                style="padding: 10px 20px; margin-right: 15px; cursor: pointer;">
                Anterior
            </button>

            <span style="font-weight: bold; font-size: 1.1rem;">
                Página {{ paginaActual }}
            </span>

            <button [disabled]="animales.length < 20" (click)="cambiarPagina(paginaActual + 1)"
                style="padding: 10px 20px; margin-left: 15px; cursor: pointer;">
                Siguiente
            </button>

        </div>
        <div *ngIf="animales.length === 0" class="sin-resultados">
            <p>Actualmente no hay animales disponibles para adopción.</p>
        </div>

    </div>
</div>
