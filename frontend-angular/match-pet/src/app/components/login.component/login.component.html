<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>🐾 MatchPet</h2>
            <p>Inicia sesión en tu cuenta</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com"
                    [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                <div class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    <small *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</small>
                    <small *ngIf="loginForm.get('email')?.errors?.['email']">Por favor, ingresa un correo
                        válido.</small>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contraseña"
                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <div class="error-text"
                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    <small *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</small>
                </div>
            </div>

            <div class="server-error" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-submit">
                Entrar
            </button>

        </form>
    </div>
</div>
