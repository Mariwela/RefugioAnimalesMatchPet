<header class="main-header">
    <div class="container">
        <div class="logo-container">
            <h2 class="brand-logo">
                <span class="logo-icon">🐾</span>
                <span class="logo-match">Match</span><span class="logo-pet">Pet</span>
            </h2>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
                </li>
                <li><a routerLink="/animales" routerLinkActive="active">Adoptar</a></li>
                <li><a routerLink="/historias" routerLinkActive="active">Historias</a></li>

                @if (authService.isAdmin()) {
                <li>
                    <a routerLink="/animales/crear" routerLinkActive="active" class="admin-link">
                        <i class="fa fa-plus"></i> Añadir Animal
                    </a>
                </li>
                }
            </ul>
        </nav>

        <div class="user-actions">
            <div class="search-box">
                <input type="text" placeholder="Buscar mascotas, razas...">
                <i class="fa fa-search"></i>
            </div>

            @if (!authService.isLoggedIn()) {

            <div class="auth-buttons">
                <a routerLink="/login" class="btn-login">Entrar</a>
            </div>

            } @else {

            <div class="user-icons">
                <a routerLink="/mis-favoritos" routerLinkActive="active" class="action-link" title="Mis Favoritos">
                    <i class="fa fa-heart icon-salmon"></i>
                    <span class="action-text">Favoritos</span>
                </a>

                <a routerLink="/mis-solicitudes" routerLinkActive="active" class="action-link" title="Mis Solicitudes">
                    <i class="fa fa-list-alt icon-dark"></i>
                    <span class="action-text">Solicitudes</span>
                </a>

                <div class="notification-wrapper" [title]="mensajeNotificaciones">
                    <i class="fa-solid fa-bell notification-icon"></i>

                    @if (totalNotificaciones > 0) {
                    <span class="badge-notificacion">
                        {{ totalNotificaciones }}
                    </span>
                    }
                </div>

                <div class="user-profile">
                    <span class="user-greeting">Hola, {{ nombreUsuario }}</span>
                    <img [src]="urlAvatar" [alt]="nombreUsuario" class="avatar">
                    <button (click)="cerrarSesion()" class="btn-logout" title="Cerrar sesión">
                        <i class="fa fa-sign-out"></i> Salir
                    </button>
                </div>
            </div>

            }
        </div>
    </div>
</header>
