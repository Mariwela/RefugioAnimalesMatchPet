<header class="main-header">
    <div class="container">
        <div class="logo-container">
            <h2 class="brand-logo">
                <span class="logo-icon">🐾</span>
                <span class="logo-match">Match</span><span class="logo-pet">Pet</span>
            </h2>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
                </li>
                <li><a routerLink="/animales" routerLinkActive="active">Adoptar</a></li>
                <li><a routerLink="/pareja" routerLinkActive="active">Encontrar Pareja</a></li>
                <li><a routerLink="/eventos" routerLinkActive="active">Eventos</a></li>
                <li><a routerLink="/comunidad" routerLinkActive="active">Comunidad</a></li>
                <li *ngIf="authService.isAdmin()">
                    <a routerLink="/animales/crear" routerLinkActive="active" class="admin-link">
                        <i class="fa fa-plus"></i> Añadir Animal
                    </a>
                </li>
            </ul>
        </nav>

        <div class="user-actions">
            <div class="search-box">
                <input type="text" placeholder="Buscar mascotas, razas...">
                <i class="fa fa-search"></i>
            </div>

            <div class="auth-buttons" *ngIf="!authService.isLoggedIn()">
                <a routerLink="/login" class="btn-login">Entrar</a>
            </div>

            <div class="user-icons" *ngIf="authService.isLoggedIn()">

                <a routerLink="/mis-favoritos" routerLinkActive="active" class="fav-link" title="Mis Favoritos">
                    <i class="fa fa-heart"></i>
                    <span class="fav-text">Favoritos</span>
                </a>

                <a routerLink="/mis-solicitudes" routerLinkActive="active" class="soli-link" title="Mis Solicitudes">
                    <i class="fa fa-list-alt"></i>
                    <span class="soli-text">Solicitudes</span>
                </a>

                <div class="notification-wrapper" [title]="mensajeNotificaciones">
                    <i class="fa-solid fa-bell notification-icon"></i> <span class="badge-notificacion"
                        *ngIf="totalNotificaciones > 0">
                        {{ totalNotificaciones }}
                    </span>
                </div>

                <div class="user-profile">
                    <span class="user-greeting">Hola, {{ nombreUsuario }}</span>
                    <img [src]="urlAvatar" [alt]="nombreUsuario" class="avatar">
                    <button (click)="cerrarSesion()" class="btn-logout" title="Cerrar sesión">
                        <i class="fa fa-sign-out"></i> Salir
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <router-outlet></router-outlet>
</main>
